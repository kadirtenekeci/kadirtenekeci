<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animation</title>
<style>
  :root {
    /* Motion tokens */
    --dur-xs: 100ms; --dur-sm: 200ms; --dur-md: 320ms; --dur-lg: 560ms; --dur-xl: 900ms;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    /* Colors */
    --bg: #0f1115; --fg: #f4f1ea; --accent: #d97757;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #faf9f5; --fg: #1f1e1b; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: var(--bg); color: var(--fg);
    font: 500 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }

  /* --- Scene --- */
  .dot {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--accent);
    animation: pop var(--dur-md) var(--ease-back) both;
  }
  @keyframes pop {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 1ms !important;
    }
  }
</style>
</head>
<body>
  <div class="dot" aria-hidden="true"></div>
</body>
</html>
