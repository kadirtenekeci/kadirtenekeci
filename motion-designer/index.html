<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Motion Designer</title>
<style>
  :root {
    --bg: #faf9f5; --panel: #ffffff; --fg: #1f1e1b; --muted: #6b6860; --line: #e6e3da;
    --accent: #d97757; --accent-fg: #ffffff; --code-bg: #f3f1ea; --danger: #b3261e;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1d1c1a; --fg: #f4f1ea; --muted: #a29f95; --line: #33312d;
      --code-bg: #242320; --danger: #f2b8b5;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413; --panel: #1d1c1a; --fg: #f4f1ea; --muted: #a29f95; --line: #33312d;
    --code-bg: #242320; --danger: #f2b8b5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  header .spacer { flex: 1; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 8px 12px; cursor: pointer;
    transition: transform 100ms var(--ease-out), background-color 100ms var(--ease-out);
  }
  button:active { transform: scale(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  main {
    display: grid; grid-template-columns: minmax(300px, 420px) 1fr; gap: 16px;
    padding: 16px; height: calc(100vh - 64px);
  }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 4px; }
  textarea { width: 100%; min-height: 110px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; min-height: 80px; }
  .msg { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--code-bg); white-space: pre-wrap; }
  .msg.user { background: transparent; border: 1px solid var(--line); }
  .msg.error { color: var(--danger); }
  .stage { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden; }
  .tabs { display: flex; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
  .tabs button[aria-selected="true"] { background: var(--code-bg); font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  pre {
    flex: 1; margin: 0; overflow: auto; padding: 12px; background: var(--code-bg);
    font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .hidden { display: none !important; }
  .status { font-size: 13px; color: var(--muted); }
  .muted { color: var(--muted); font-size: 13px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; }
    .stage { min-height: 70vh; }
    header input { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<header>
  <h1>Claude <span>Motion</span> Designer</h1>
  <div class="spacer"></div>
  <input id="apiKey" type="password" placeholder="Anthropic API anahtarı (sk-ant-…)" autocomplete="off" style="min-width:260px">
  <select id="model" aria-label="Model">
    <option value="claude-opus-5-5">Claude Opus 5.5</option>
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
  </select>
</header>

<main>
  <section class="col">
    <div class="card">
      <label for="prompt">Ne canlandıralım?</label>
      <textarea id="prompt" placeholder="Örn: Turuncu bir noktadan açılan, 'Kadir Tenekeci' yazısını çizerek ortaya çıkaran logo animasyonu"></textarea>
      <div class="chips" style="margin:8px 0">
        <button data-preset="Sonsuz döngüde dönen, 3 noktadan oluşan zarif bir yükleniyor animasyonu">Loader</button>
        <button data-preset="İsmimi harf harf çizerek ortaya çıkaran bir logo reveal animasyonu, sonunda 2 sn beklesin">Logo reveal</button>
        <button data-preset="GitHub profil README'si için 'Hi, I'm Kadir' yazan, JS içermeyen animasyonlu SVG banner">README banner</button>
        <button data-preset="Tıklanınca kalbin dolduğu, parçacık patlamalı bir 'beğen' butonu mikro etkileşimi">Like butonu</button>
        <button data-preset="Kartların sırayla (stagger) aşağıdan yükselerek geldiği bir liste giriş animasyonu">Stagger liste</button>
      </div>
      <div class="row">
        <button id="generate" class="primary">Oluştur</button>
        <button id="reset">Yeni sohbet</button>
        <span id="status" class="status"></span>
      </div>
      <p class="muted" style="margin:8px 0 0">İlk sonuçtan sonra "daha yavaş", "rengi mor yap" gibi düzeltmeler yazabilirsin — aynı animasyon üzerinde çalışmaya devam eder.</p>
    </div>
    <div class="card log" id="log" aria-live="polite"></div>
  </section>

  <section class="col">
    <div class="card stage">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="preview">Önizleme</button>
        <button role="tab" aria-selected="false" data-tab="code">Kod</button>
        <div class="spacer" style="flex:1"></div>
        <button id="replay" disabled>↻ Tekrar oynat</button>
        <button id="copy" disabled>Kopyala</button>
        <button id="download" disabled>İndir</button>
      </div>
      <iframe id="preview" title="Animasyon önizlemesi" sandbox="allow-scripts"></iframe>
      <pre id="code" class="hidden"></pre>
    </div>
  </section>
</main>

<script type="module">
  import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk/+esm";

  const SYSTEM_PROMPT = `You are Claude Motion Designer: a senior motion designer who ships code.

Turn the user's brief into ONE self-contained animation file.

Workflow:
1. In 1-2 short sentences (in the user's language), state the concept and any defaults you chose.
2. Give a compact beat sheet: start–end ms, element, property, curve.
3. Output the complete file in a single fenced code block: \`\`\`html for web pages, or \`\`\`svg for README/SVG banners.

Motion tokens — use only these:
--dur-xs 100ms, --dur-sm 200ms, --dur-md 320ms, --dur-lg 560ms, --dur-xl 900ms
--ease-out cubic-bezier(0.16,1,0.3,1) (entering, default)
--ease-in cubic-bezier(0.7,0,0.84,0) (leaving)
--ease-in-out cubic-bezier(0.65,0,0.35,1) (moving on screen, loops)
--ease-back cubic-bezier(0.34,1.56,0.64,1) (playful overshoot)
linear only for continuous rotation/progress.

Rules:
- Declare tokens and colors as CSS custom properties at the top so they are easy to tune.
- Animate only transform, opacity, clip-path, filter (sparingly) and SVG stroke-dashoffset. Never width/height/top/left/margin.
- Stagger overlapping beats (30–60ms per item); exits 20–30% shorter than entrances; nothing over ~1s for UI.
- animation-fill-mode: both. Loops must be seamless.
- Include a prefers-reduced-motion fallback whose end state is still correct.
- No external libraries, fonts or network requests. System font stack only.
- For SVG meant for GitHub READMEs: no JavaScript at all, CSS @keyframes inside <style> only.
- The page must look good centered in any viewport, including 360px wide, on its own background.
- For one-shot storytelling pieces, hold the final frame (don't loop unless asked).
- When the user asks for a change, return the FULL updated file, not a diff.`;

  const $ = (id) => document.getElementById(id);
  const els = {
    apiKey: $("apiKey"), model: $("model"), prompt: $("prompt"), generate: $("generate"),
    reset: $("reset"), status: $("status"), log: $("log"), preview: $("preview"),
    code: $("code"), replay: $("replay"), copy: $("copy"), download: $("download"),
  };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  els.apiKey.value = store.get("cmd.apiKey") || "";
  els.model.value = store.get("cmd.model") || "claude-opus-5-5";
  els.apiKey.addEventListener("change", () => store.set("cmd.apiKey", els.apiKey.value.trim()));
  els.model.addEventListener("change", () => store.set("cmd.model", els.model.value));

  let messages = [];         // append-only conversation history
  let current = null;        // { lang, source }
  let busy = false;

  const EMPTY_PREVIEW = `<!doctype html><body style="margin:0;height:100vh;display:grid;place-items:center;font:15px system-ui;color:#8a877e;background:#faf9f5">Animasyonun burada görünecek</body>`;
  els.preview.srcdoc = EMPTY_PREVIEW;

  document.querySelectorAll("[data-preset]").forEach((b) =>
    b.addEventListener("click", () => { els.prompt.value = b.dataset.preset; els.prompt.focus(); }));

  document.querySelectorAll("[data-tab]").forEach((tab) =>
    tab.addEventListener("click", () => {
      document.querySelectorAll("[data-tab]").forEach((t) => t.setAttribute("aria-selected", String(t === tab)));
      const showCode = tab.dataset.tab === "code";
      els.code.classList.toggle("hidden", !showCode);
      els.preview.classList.toggle("hidden", showCode);
    }));

  function addMsg(text, cls = "") {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.textContent = text;
    els.log.appendChild(div);
    els.log.scrollTop = els.log.scrollHeight;
    return div;
  }

  // Pull the last fenced html/svg block out of the text. While streaming, an unclosed fence is accepted.
  function extractCode(text) {
    const re = /```(html|svg|xml)?\s*\n([\s\S]*?)(```|$)/g;
    let m, last = null;
    while ((m = re.exec(text))) last = { lang: (m[1] || "html").replace("xml", "svg"), source: m[2], closed: m[3] === "```" };
    return last;
  }
  function stripCode(text) {
    return text.replace(/```(html|svg|xml)?\s*\n[\s\S]*?(```|$)/g, "[kod → sağ panel]").trim();
  }

  function toDocument({ lang, source }) {
    if (lang === "svg") {
      return `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}body{display:grid;place-items:center;background:#faf9f5}@media (prefers-color-scheme:dark){body{background:#141413}}svg{max-width:100%;height:auto}</style></head><body>${source}</body></html>`;
    }
    return source;
  }

  function render() {
    if (!current) return;
    els.preview.srcdoc = toDocument(current);
  }

  function setBusy(b, label = "") {
    busy = b;
    els.generate.disabled = b;
    els.generate.textContent = b ? "Oluşturuluyor…" : (messages.length ? "Düzelt" : "Oluştur");
    els.status.textContent = label;
  }

  async function generate() {
    const key = els.apiKey.value.trim();
    const prompt = els.prompt.value.trim();
    if (busy || !prompt) return;
    if (!key) { addMsg("Önce sağ üstten Anthropic API anahtarını gir.", "error"); els.apiKey.focus(); return; }
    store.set("cmd.apiKey", key);

    const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
    const userMsg = { role: "user", content: prompt };
    addMsg(prompt, "user");
    els.prompt.value = "";
    const out = addMsg("…");
    setBusy(true, "Tasarlanıyor…");

    let text = "";
    try {
      const stream = client.beta.messages.stream({
        model: els.model.value,
        max_tokens: 32000,
        system: SYSTEM_PROMPT,
        thinking: { type: "adaptive" },
        output_config: { effort: "medium" },
        betas: ["server-side-fallback-2026-07-01"],
        fallbacks: "default",
        messages: [...messages, userMsg],
      });

      stream.on("text", (delta) => {
        text += delta;
        out.textContent = stripCode(text) || "…";
        const code = extractCode(text);
        if (code) {
          els.code.textContent = code.source;
          els.code.scrollTop = els.code.scrollHeight;
          els.status.textContent = code.closed ? "Önizleme hazırlanıyor…" : "Kod yazılıyor…";
        }
      });

      const final = await stream.finalMessage();

      if (final.stop_reason === "refusal") {
        out.classList.add("error");
        out.textContent = "Bu istek yanıtlanamadı" + (final.stop_details?.explanation ? `: ${final.stop_details.explanation}` : ".");
        return;
      }

      // Keep history append-only: send the assistant content back exactly as received.
      messages.push(userMsg, { role: "assistant", content: final.content });

      const code = extractCode(text);
      if (!code) {
        out.textContent = text || "Kod bloğu gelmedi, isteği biraz daha net yazmayı dene.";
        return;
      }
      if (final.stop_reason === "max_tokens") {
        addMsg("Yanıt uzunluk sınırına takıldı; kod eksik olabilir. \"Devam et\" yazabilirsin.", "error");
      }
      current = { lang: code.lang, source: code.source.trim() };
      els.code.textContent = current.source;
      render();
      [els.replay, els.copy, els.download].forEach((b) => (b.disabled = false));
    } catch (err) {
      out.classList.add("error");
      if (err instanceof Anthropic.AuthenticationError) out.textContent = "API anahtarı geçersiz.";
      else if (err instanceof Anthropic.RateLimitError) out.textContent = "Hız sınırına takıldın, biraz bekleyip tekrar dene.";
      else if (err instanceof Anthropic.APIError) out.textContent = `API hatası (${err.status ?? "?"}): ${err.message}`;
      else out.textContent = `Hata: ${err?.message || err}`;
    } finally {
      setBusy(false);
    }
  }

  els.generate.addEventListener("click", generate);
  els.prompt.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate();
  });
  els.reset.addEventListener("click", () => {
    if (busy) return;
    messages = []; current = null;
    els.log.innerHTML = ""; els.code.textContent = "";
    els.preview.srcdoc = EMPTY_PREVIEW;
    [els.replay, els.copy, els.download].forEach((b) => (b.disabled = true));
    setBusy(false);
  });
  els.replay.addEventListener("click", render);
  els.copy.addEventListener("click", async () => {
    if (!current) return;
    try { await navigator.clipboard.writeText(current.source); els.status.textContent = "Kopyalandı"; }
    catch { els.status.textContent = "Kopyalanamadı"; }
  });
  els.download.addEventListener("click", () => {
    if (!current) return;
    const type = current.lang === "svg" ? "image/svg+xml" : "text/html";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([current.source], { type }));
    a.download = current.lang === "svg" ? "animation.svg" : "animation.html";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
</script>
</body>
</html>
