name: Fetch Mumlamp assets from Canva
on:
  push:
    branches: [ccr-eb067ecd-sepbcl]
    paths: [mumlamp-assets/urls.tsv, mumlamp-assets/fetch.py, .github/workflows/mumlamp-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python mumlamp-assets/fetch.py
      - name: Commit images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mumlamp-assets/products mumlamp-assets/hero mumlamp-assets/scenes 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Add Mumlamp product, hero and scene images (JPG, <=1600px)"
          git push
