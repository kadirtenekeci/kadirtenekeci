name: Fetch Mumlamp assets from Canva
on:
  push:
    branches: [ccr-eb067ecd-sepbcl]
    paths: [mumlamp-assets/urls.tsv]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python mumlamp-assets/fetch.py
      - name: Commit images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mumlamp-assets
          git diff --cached --quiet && exit 0
          git commit -m "Add new Mumlamp lifestyle, style and location images"
          git push
